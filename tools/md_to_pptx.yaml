identity:
  name: md_to_pptx
  author: masayukikiyota
  label:
    en_US: Markdown to PowerPoint
    ja_JP: Markdown を PowerPoint に変換
description:
  human:
    en_US: Convert Markdown into a .pptx deck using an uploaded PowerPoint template.
    ja_JP: アップロードした PowerPoint テンプレートを使って Markdown を .pptx に変換します。
  llm: Converts Markdown into a PowerPoint (.pptx) presentation and returns it as a downloadable file. A PowerPoint template (.pptx or .potx) must be supplied - its layouts, theme colors and fonts are reused for the generated deck, and the layout to use for each kind of slide is detected automatically so no configuration is normally required. The Markdown is mapped to slides as follows - YAML front matter with a title becomes the cover slide, a level-1 heading becomes a section divider slide, a level-2 heading starts a new slide, and level-3/4 headings become in-slide headings. Bullet lists (up to 5 levels), ordered lists, tables with column alignment, fenced code blocks, block quotes, horizontal rules, images and inline bold/italic/code/strikethrough/links are all supported. Returns metadata plus the .pptx file itself.
parameters:
  - name: markdown_text
    type: string
    required: false
    label:
      en_US: Markdown text
      ja_JP: Markdown テキスト
    human_description:
      en_US: The Markdown source to convert. Ignored when a Markdown file is also supplied.
      ja_JP: 変換する Markdown 本文。Markdown ファイルも指定した場合はファイルが優先されます。
    llm_description: The Markdown source to convert into slides. Supply either this or markdown_file. Use YAML front matter (title / subtitle / author / date) for the cover slide, "#" for section dividers and "##" for each content slide.
    form: llm
  - name: markdown_file
    type: file
    required: false
    label:
      en_US: Markdown file
      ja_JP: Markdown ファイル
    human_description:
      en_US: A .md or .txt file to convert. Takes precedence over the Markdown text field.
      ja_JP: 変換する .md / .txt ファイル。Markdown テキストより優先されます。
    llm_description: An uploaded Markdown file to convert. Supply either this or markdown_text.
    form: llm
  - name: template_file
    type: file
    required: true
    label:
      en_US: PowerPoint template
      ja_JP: PowerPoint テンプレート
    human_description:
      en_US: The .pptx or .potx template whose layouts, theme and fonts are used. The right layouts are detected automatically, so no configuration is normally needed.
      ja_JP: レイアウト・テーマ・フォントを流用する .pptx / .potx。使うレイアウトは自動判定されるため、通常は設定不要です。
    llm_description: The PowerPoint template file (.pptx or .potx) to base the deck on. This is required. The layouts to use for the cover, section dividers, content slides and so on are detected automatically from the template, so no further configuration is needed in the normal case.
    form: llm
  - name: config_yaml
    type: string
    required: false
    default: ""
    label:
      en_US: Mapping config (YAML)
      ja_JP: マッピング設定（YAML）
    human_description:
      en_US: >-
        Usually unnecessary - the layouts are detected automatically. Use this only to override the detection, or to change fonts, sizes, colors and options. Anything you leave out keeps its auto-detected or default value. By default nothing is overridden: fonts, font sizes, colours, the table style and the list indent are all left unset, and table cells are not painted, so the template's own theme is used. The deck's proofing language is copied from the template and spell/grammar checking is turned off. Fill in only what you want to pin down.
      ja_JP: 通常は不要です（レイアウトは自動判定されます）。判定結果を上書きしたい場合や、フォント・サイズ・色・オプションを変えたい場合にのみ指定します。書かなかった項目は自動判定値・既定値のままです。 既定では書体・文字サイズ・色・表スタイル・字下げをいずれも上書きせず、表のセルも塗らないため、テンプレート（スライドマスター／テーマ）の設定がそのまま出ます。校正言語はテンプレートから読み取って全体に適用し、スペルチェックと文章校正はオフにします。固定したい項目だけ書いてください。
    llm_description: Optional YAML configuration. Normally omit it - the layouts are auto-detected from the template. Supply it only to override the detection or to change presentation settings (keys - layouts, placeholders, fonts, sizes, colors, table, quote, image, spacing, options). Values given here always win over the auto-detected ones; omitted keys keep their auto-detected or default value. The defaults for fonts, sizes, colors, table.style_id and spacing.list_indent are all null, meaning "do not set this", and table.explicit_format defaults to false, so the template's own fonts, text sizes, colours, table style and indentation are kept unless you override them. Each sizes value is a number in points or null; sizes.body may also be a list of per-level numbers. options.language defaults to "auto" (copy the proofing language found in the template; falls back to ja-JP) and accepts a BCP-47 tag such as "ja-JP" or null to write no language at all; options.no_proof defaults to true, which turns off spell and grammar checking.
    form: form
  - name: file_name
    type: string
    required: false
    default: presentation.pptx
    label:
      en_US: Output file name
      ja_JP: 出力ファイル名
    human_description:
      en_US: Name of the generated file. A .pptx extension is added when missing.
      ja_JP: 生成されるファイルの名前。.pptx が無ければ自動で付きます。
    llm_description: The file name for the generated PowerPoint file, for example "quarterly-review.pptx".
    form: llm
output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: Whether the conversion succeeded.
    file_name:
      type: string
      description: Name of the generated PowerPoint file.
    mime_type:
      type: string
      description: MIME type of the generated file.
    size:
      type: number
      description: Size of the generated file in bytes.
    slide_count:
      type: number
      description: Number of slides in the generated deck, after automatic splitting.
    spec_count:
      type: number
      description: Number of slides derived from the headings, before automatic splitting.
    template_name:
      type: string
      description: File name of the template that was used.
    meta:
      type: object
      description: Front matter values picked up from the Markdown (title, subtitle, author, date).
    layouts_used:
      type: object
      description: The template layout name actually used for each slide kind (title, section, content, table, blank). These are auto-detected from the template unless config_yaml overrides them.
    language_used:
      type: string
      description: The proofing language written into the deck, detected from the template unless options.language overrides it. Null when options.language is null.
    outline:
      type: string
      description: Human-readable list of the generated slides.
    warnings:
      type: array
      description: Non-fatal problems, such as layout names missing from the template or unresolved images.
      items:
        type: string
    error:
      type: string
      description: Error message when success is false.
extra:
  python:
    source: tools/md_to_pptx.py
