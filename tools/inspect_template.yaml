identity:
  name: inspect_template
  author: masayukikiyota
  label:
    en_US: Inspect PowerPoint template
    ja_JP: PowerPoint テンプレート解析
description:
  human:
    en_US: List the slide layouts and placeholders of a PowerPoint template, and optionally generate a starter mapping config.
    ja_JP: PowerPoint テンプレートのスライドレイアウトとプレースホルダを一覧表示し、必要ならマッピング設定の雛形も生成します。
  llm: Analyzes a PowerPoint template (.pptx or .potx) and reports its slide size, slide masters, and every slide layout with the placeholder index, type, name and position of each placeholder. The "Markdown to PowerPoint" tool detects layouts on its own, so this is not a required first step - use it to inspect a template, or when that tool picked the wrong layout. Set emit_config to true to also return the layout mapping it would detect, as YAML ready to adjust and paste into that tool's config_yaml parameter.
parameters:
  - name: template_file
    type: file
    required: true
    label:
      en_US: PowerPoint template
      ja_JP: PowerPoint テンプレート
    human_description:
      en_US: The .pptx or .potx file to analyze.
      ja_JP: 解析する .pptx / .potx ファイル。
    llm_description: The PowerPoint template file (.pptx or .potx) to analyze.
    form: llm
  - name: emit_config
    type: boolean
    required: false
    default: false
    label:
      en_US: Generate mapping config
      ja_JP: マッピング設定を生成
    human_description:
      en_US: Also return the layout mapping that would be auto-detected for this template, as YAML and as a config.yaml file. Useful for checking or adjusting the detection.
      ja_JP: このテンプレートに対して自動判定されるレイアウト対応を YAML と config.yaml ファイルで返します。判定結果の確認・調整に使います。
    llm_description: Set to true to also return the layout mapping that would be auto-detected for this template, as YAML. Default is false.
    form: llm
output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: Whether the analysis succeeded.
    template_name:
      type: string
      description: File name of the analyzed template.
    slide_width_in:
      type: number
      description: Slide width in inches.
    slide_height_in:
      type: number
      description: Slide height in inches.
    aspect_ratio:
      type: string
      description: Slide aspect ratio, for example 16:9.
    master_count:
      type: number
      description: Number of slide masters.
    layout_count:
      type: number
      description: Number of slide layouts.
    layout_names:
      type: array
      description: Names of every slide layout, in order.
      items:
        type: string
    layouts:
      type: array
      description: Every slide layout with its placeholders.
      items:
        type: object
    language:
      type: string
      description: Proofing language found in the template (the most common lang attribute), or ja-JP when the template has none.
    suggested_config:
      type: object
      description: Guessed layout and placeholder mapping, or null when emit_config is false.
    config_yaml:
      type: string
      description: The suggested mapping as YAML text, or null when emit_config is false.
    error:
      type: string
      description: Error message when success is false.
extra:
  python:
    source: tools/inspect_template.py
