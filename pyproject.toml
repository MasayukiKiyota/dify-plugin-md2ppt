[project]
name = "dify-md2ppt"
version = "0.1.0"
description = "Markdown to PowerPoint tool plugin for Dify"
readme = "README.md"
requires-python = ">=3.12"

# Refresh the lockfile after dependency changes with: uv lock
dependencies = [
    "dify_plugin>=0.9.0",
    "python-pptx>=1.0.2",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = []
